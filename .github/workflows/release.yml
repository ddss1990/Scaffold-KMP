name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macos
            task: :desktopApp:packageDmg
            ext: dmg
          - os: windows-latest
            os_name: windows
            task: :desktopApp:packageMsi
            ext: msi
          - os: ubuntu-latest
            os_name: linux
            task: :desktopApp:packageDeb
            ext: deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build desktop package
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew "${{ matrix.task }}" --no-daemon

      - name: Collect package
        shell: bash
        run: |
          mkdir -p out
          find desktopApp/build/compose/binaries -type f -name "*.${{ matrix.ext }}" -print -exec cp {} out/ \;
          ls -lh out

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os_name }}
          path: out/*.${{ matrix.ext }}
          if-no-files-found: error

  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build web distribution
        run: |
          chmod +x ./gradlew
          ./gradlew :webApp:composeCompatibilityBrowserDistribution --no-daemon

      - name: Pack web files
        run: |
          mkdir -p out
          cd webApp/build/dist
          tar -czf ../../../out/web-dist.tar.gz .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: out/web-dist.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - desktop
      - web
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release files
        run: find artifacts -type f | sort

      - name: Resolve preview URL
        id: preview
        shell: bash
        run: |
          echo "value=https://${GITHUB_REPOSITORY_OWNER}.github.io/$(basename "$GITHUB_REPOSITORY")/" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Release ${{ steps.tag.outputs.value }}
          body: |
            ## Online Preview
            - Web Preview: ${{ steps.preview.outputs.value }}
          files: artifacts/**/*
